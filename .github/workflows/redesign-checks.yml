name: Campus Loop redesign checks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/campus-loop-full-redesign-20261118
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-redesign-contracts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/redesign-checks.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Redesign source contract checks
        run: node --test scripts/test-redesign-contracts.mjs
      - name: Frontend production build
        run: npm run build:frontend
      - name: Entry render check
        run: npm run test:entry
